<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo Wall</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wall { background-color:#f8fafc; background-image:radial-gradient(#dbe1ea .7px,transparent .7px); background-size:18px 18px; }
  .card { overflow-wrap:anywhere; white-space:pre-wrap; }
  .modal-backdrop { background:rgba(15,23,42,.28); backdrop-filter:blur(3px); }
</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <main class="wall min-h-screen p-4 sm:p-8">
    <section id="wall" class="mx-auto grid max-w-7xl grid-cols-1 items-start gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5"></section>
    <button id="add" aria-label="Add todo" class="fixed bottom-6 right-6 flex h-14 w-14 items-center justify-center rounded-full bg-slate-900 text-3xl font-light leading-none text-white shadow-xl transition hover:scale-105 hover:bg-indigo-600 focus:outline-none focus:ring-4 focus:ring-indigo-200">+</button>
  </main>

  <div id="modal" class="modal-backdrop fixed inset-0 z-10 hidden items-center justify-center p-4">
    <form id="form" class="w-full max-w-md rounded-2xl bg-white p-5 shadow-2xl sm:p-6">
      <input id="title" maxlength="120" required placeholder="Title" aria-label="Title" class="mb-3 w-full border-0 border-b border-slate-200 px-1 py-3 text-xl font-semibold outline-none placeholder:text-slate-400 focus:border-slate-900">
      <textarea id="text" maxlength="1200" rows="5" placeholder="Write something..." aria-label="Text" class="w-full resize-y border-0 px-1 py-2 text-sm leading-6 outline-none placeholder:text-slate-400"></textarea>
      <div class="mt-4 flex justify-end gap-2">
        <button type="button" id="cancel" class="rounded-lg px-4 py-2 text-sm text-slate-500 hover:bg-slate-100">Cancel</button>
        <button type="submit" class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-600">Save</button>
      </div>
    </form>
  </div>

<script>
(() => {
  const KEY = 'minimal-todo-wall-v1';
  const $ = id => document.getElementById(id);
  const shades = ['bg-amber-100','bg-rose-100','bg-sky-100','bg-emerald-100','bg-violet-100','bg-orange-100','bg-lime-100'];
  let todos = [];
  try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) todos = saved; } catch (_) {}
  let editingId = null;

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (_) {}
  }
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function render() {
    $('wall').innerHTML = todos.map((todo, i) => `
      <article class="card ${shades[i % shades.length]} min-h-36 cursor-pointer rounded-sm p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md" data-id="${escapeHtml(todo.id)}" title="Click to edit">
        ${todo.title ? `<h2 class="mb-2 text-base font-bold leading-snug">${escapeHtml(todo.title)}</h2>` : ''}
        ${todo.text ? `<p class="text-sm leading-6 text-slate-700">${escapeHtml(todo.text)}</p>` : ''}
      </article>
    `).join('');
    $('wall').querySelectorAll('[data-id]').forEach(card => {
      card.addEventListener('click', () => open(todos.find(t => t.id === card.dataset.id)));
      card.addEventListener('contextmenu', e => {
        e.preventDefault();
        const todo = todos.find(t => t.id === card.dataset.id);
        if (todo && confirm('Delete this card?')) { todos = todos.filter(t => t.id !== todo.id); save(); render(); }
      });
    });
  }
  function open(todo = null) {
    editingId = todo?.id || null;
    $('title').value = todo?.title || '';
    $('text').value = todo?.text || '';
    $('modal').classList.remove('hidden');
    $('modal').classList.add('flex');
    setTimeout(() => $('title').focus(), 30);
  }
  function close() {
    $('modal').classList.add('hidden');
    $('modal').classList.remove('flex');
    editingId = null;
  }
  $('add').addEventListener('click', () => open());
  $('cancel').addEventListener('click', close);
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('title').value.trim(), text = $('text').value.trim();
    if (!title && !text) { close(); return; }
    if (editingId) {
      todos = todos.map(t => t.id === editingId ? {...t, title, text} : t);
    } else {
      todos.unshift({id: (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)), title, text});
    }
    save(); render(); close();
  });
  render();
})();
</script>
</body>
</html>
